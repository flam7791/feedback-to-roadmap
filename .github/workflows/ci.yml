name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Acceptance tests (one or more per backlog story)
        run: pytest -q
      - name: Definition of Done - every Done story has a test
        run: python tools/trace.py
      - name: The worked example runs end to end
        run: python tools/demo.py --out out
      - name: Codebook on the held-out gold set
        run: f2r measure --gold data/gold/heldout.csv
      - name: The sample is what the generator produces
        run: python tools/make_sample.py && git diff --exit-code data/
      - name: Scrub for material that must not be public
        run: python tools/scrub_check.py .
